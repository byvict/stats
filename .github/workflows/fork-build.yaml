name: fork-build

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - master
      - custom

permissions:
  contents: read

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-app
        with:
          artifact-name: Stats-${{ github.sha }}
