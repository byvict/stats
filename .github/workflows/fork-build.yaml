name: fork-build

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner image
        type: choice
        options:
          - macos-latest
          - macos-26-intel
  push:
    branches-ignore:
      - master
      - custom

permissions:
  contents: read

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-latest' }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-app
        with:
          artifact-name: Stats-${{ github.sha }}
